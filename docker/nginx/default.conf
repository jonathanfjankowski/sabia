# Nginx - Sabiá API (Laravel)
server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;
    index index.php index.html;

    # Logs
    access_log /var/log/nginx/sabia-access.log;
    error_log  /var/log/nginx/sabia-error.log;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # Segurança
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Health check
    location /up {
        access_log off;
        return 200;
        add_header Content-Type text/plain;
    }

    # Arquivos estáticos
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Assets buildados do Vite (se houver)
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Uploads
    location /storage/ {
        alias /var/www/html/storage/app/public/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # PHP-FPM
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_read_timeout 300;
    }

    # Negar acesso a arquivos ocultos
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Negar acesso a certos diretórios
    location ~ ^/(app|bootstrap|config|database|resources|routes|storage/framework|storage/logs|vendor|node_modules) {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }
}
