# ============================================================
# Docker Compose - Sabiá v3.0
# Chatbot Inteligente com IA + Base de Conhecimento
# ============================================================
# Uso:
#   docker compose up -d              # Iniciar tudo
#   docker compose logs -f            # Ver logs
#   docker compose exec laravel bash  # Acessar container Laravel
#   docker compose down -v            # Parar + remover volumes
#
# Setup inicial (gerar APP_KEY):
#   docker compose run --rm laravel bash /entrypoint.sh --setup
#   # Copiar APP_KEY gerada para o .env
#   docker compose up -d
# ============================================================

services:
  # ─────────────────────────────────────────────
  # PostgreSQL 16 + pgvector + RLS
  # ─────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sabia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sabia_db}
      POSTGRES_USER: ${POSTGRES_USER:-sabia_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sabia_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - sabia_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sabia_user} -d ${POSTGRES_DB:-sabia_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ─────────────────────────────────────────────
  # Laravel 12 API (PHP 8.3 + Nginx + FPM)
  # ─────────────────────────────────────────────
  laravel:
    build:
      context: .
      dockerfile: sabia-api/Dockerfile
    container_name: sabia-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-80}:80"
    environment:
      APP_NAME: ${APP_NAME:-Sabiá}
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY:-}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost}

      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-sabia_db}
      DB_USERNAME: ${POSTGRES_USER:-sabia_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-sabia_password}

      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

      LOG_CHANNEL: ${LOG_CHANNEL:-stack}
      LOG_LEVEL: ${LOG_LEVEL:-warning}

      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
    volumes:
      - laravel_storage:/var/www/html/storage
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sabia_network

  # ─────────────────────────────────────────────
  # React Frontend (Vite + TypeScript)
  # ─────────────────────────────────────────────
  frontend:
    build:
      context: ./sabia-frontend
      dockerfile: Dockerfile
    container_name: sabia-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost/api}
      VITE_APP_NAME: ${APP_NAME:-Sabiá}
    depends_on:
      - laravel
    networks:
      - sabia_network

volumes:
  postgres_data:
    driver: local
  laravel_storage:
    driver: local

networks:
  sabia_network:
    driver: bridge
