version: '3.8'

services:
  # Banco de dados PostgreSQL com extensão pgvector
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sabia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sabia_db
      POSTGRES_USER: sabia_user
      POSTGRES_PASSWORD: sabia_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - sabia_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sabia_user -d sabia_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Laravel + PHP
  laravel:
    build:
      context: ./sabia-api
      dockerfile: Dockerfile
    container_name: sabia-api
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./sabia-api:/var/www/html
      - ./sabia-api/storage/app:/var/www/html/storage/app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sabia_network
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=sabia_db
      - DB_USERNAME=sabia_user
      - DB_PASSWORD=sabia_password

  # Frontend React + Vite
  frontend:
    build:
      context: ./sabia-frontend
      dockerfile: Dockerfile
    container_name: sabia-frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./sabia-frontend:/app
      - /app/node_modules
    depends_on:
      - laravel
    networks:
      - sabia_network
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api

volumes:
  postgres_data:
    driver: local

networks:
  sabia_network:
    driver: bridge
