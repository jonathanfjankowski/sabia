version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sabia_postgres
    environment:
      POSTGRES_DB: sabia
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Sem ports: o banco só é acessível pela rede interna do compose
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sabia-network

  # Sidecar de embeddings (BAAI/bge-m3, 1024 dims) — ver docs/arquitetura.md.
  # Primeiro build demora: baixa ~1GB de modelo. Só rede interna em prod.
  embedding-sidecar:
    build: ./embedding-sidecar
    container_name: sabia_embedding
    expose:
      - "8000"
    restart: unless-stopped
    networks:
      - sabia-network

  api:
    build:
      context: ./sabia-api
      dockerfile: Dockerfile
    container_name: sabia_api
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      # Chave vem do .env do host em runtime — nunca baked na imagem
      - APP_KEY=${APP_KEY}
      - APP_URL=https://api.seudominio.com
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=sabia
      - DB_USERNAME=postgres
      - DB_PASSWORD=${DB_PASSWORD}
      - SANCTUM_STATEFUL_DOMAINS=seudominio.com
      - SESSION_DOMAIN=seudominio.com
      - ALLOWED_ORIGINS=https://seudominio.com
      - SECURITY_HEADERS_ENABLED=true
      - EMBEDDING_URL=http://embedding-sidecar:8000
    depends_on:
      postgres:
        condition: service_healthy
      embedding-sidecar:
        condition: service_started
    ports:
      - "8000:8000"
    networks:
      - sabia-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  web:
    build:
      context: ./sabia-frontend
      dockerfile: Dockerfile
    container_name: sabia_web
    environment:
      - VITE_API_URL=https://api.seudominio.com/api
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api
    networks:
      - sabia-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

volumes:
  postgres_data:

networks:
  sabia-network:
    driver: bridge