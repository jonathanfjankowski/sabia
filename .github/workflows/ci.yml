name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PHP_VERSION: '8.3'
  NODE_VERSION: '22'

jobs:
  backend-lint:
    name: Backend Lint (Pint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, pgsql, zip, bcmath
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist
        working-directory: ./sabia-api

      - name: Run Pint
        run: ./vendor/bin/pint --test
        working-directory: ./sabia-api

  backend-tests:
    name: Backend Tests (Pest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: sabia_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, pgsql, zip, bcmath
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist
        working-directory: ./sabia-api

      - name: Prepare test database
        run: |
          cp .env.example .env.testing
          sed -i 's/DB_DATABASE=sabia/DB_DATABASE=sabia_test/' .env.testing
          php artisan migrate --force --env=testing
        working-directory: ./sabia-api
        env:
          DB_CONNECTION: pgsql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: sabia_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres

      - name: Run Pest tests
        run: php artisan test --env=testing
        working-directory: ./sabia-api
        env:
          DB_CONNECTION: pgsql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: sabia_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres

  frontend-lint:
    name: Frontend Lint (oxlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: sabia-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./sabia-frontend

      - name: Run oxlint
        run: npm run lint
        working-directory: ./sabia-frontend

  frontend-typecheck:
    name: Frontend Typecheck (tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: sabia-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./sabia-frontend

      - name: Run TypeScript check
        run: npx tsc --noEmit
        working-directory: ./sabia-frontend

  frontend-tests:
    name: Frontend Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: sabia-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./sabia-frontend

      - name: Run Vitest tests
        run: npm run test -- --run
        working-directory: ./sabia-frontend

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: sabia-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./sabia-frontend

      - name: Build
        run: npm run build
        working-directory: ./sabia-frontend

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: sabia-frontend/dist/
          retention-days: 1

  widget-build:
    name: Widget Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: sabia-widget/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./sabia-widget

      - name: Build widget
        run: npm run build
        working-directory: ./sabia-widget

      - name: Upload widget artifact
        uses: actions/upload-artifact@v4
        with:
          name: widget-dist
          path: sabia-widget/dist/
          retention-days: 1

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build, widget-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: ./sabia-api
          push: false
          tags: sabia-api:${{ github.sha }}
          load: true

      - name: Build Web image
        uses: docker/build-push-action@v5
        with:
          context: ./sabia-frontend
          push: false
          tags: sabia-web:${{ github.sha }}
          load: true

      - name: Build Widget image
        uses: docker/build-push-action@v5
        with:
          context: ./sabia-widget
          push: false
          tags: sabia-widget:${{ github.sha }}
          load: true

      - name: Verify images
        run: |
          docker images sabia-api:${{ github.sha }}
          docker images sabia-web:${{ github.sha }}
          docker images sabia-widget:${{ github.sha }}